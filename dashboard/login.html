<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Greenhouse — Đăng nhập</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🌿</div>
      <h1 class="login-title">Smart Greenhouse</h1>
      <p class="login-subtitle">Đăng nhập để truy cập dashboard</p>

      <form id="login-form">
        <div class="input-group">
          <i class="fa fa-user input-icon"></i>
          <input type="text" id="username" name="username"
                 placeholder="Tên đăng nhập" autocomplete="username" required>
        </div>
        <div class="input-group">
          <i class="fa fa-lock input-icon"></i>
          <input type="password" id="password" name="password"
                 placeholder="Mật khẩu" autocomplete="current-password" required>
        </div>
        <p class="error-text" id="error-msg"></p>
        <button type="submit" class="login-btn">
          <span id="btn-text">Đăng nhập</span>
          <i class="fa fa-spinner fa-spin" id="btn-spinner" style="display:none"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
